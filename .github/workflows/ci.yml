# Checks every push: install, Prisma schema, type check, lint, tests (with a
# throwaway Postgres), build.
on: [push, pull_request]

name: CI

jobs:
  CI:
    name: Type check, lint, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: setu_vendor_portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/setu_vendor_portal_test
      DIRECT_URL: postgresql://postgres:ci@localhost:5432/setu_vendor_portal_test
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/setu_vendor_portal_test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client, validate schema, apply migrations
        run: npx prisma generate && npx prisma validate && npx prisma migrate deploy

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
